[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-workflow-auditor"
version = "0.1.0"
description = "GitHub Actions workflow security and operational compliance auditor"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer==0.9.0",
    "rich==13.7.0",
    "ruamel.yaml==0.18.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
]

[project.scripts]
gh-audit = "auditor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
